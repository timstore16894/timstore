<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Badge -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#130b24" stroke="#8b5cf6" stroke-width="2" />
    <path d="M16 22 L44 22 M30 22 L30 46" stroke="url(#purpleGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonBlur)" />
    <!-- Dynamic Accent Dot -->
    <circle cx="44" cy="42" r="3.5" fill="#c084fc" />
  </g>

  <!-- Typography -->
  <text x="82" y="44" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="2" fill="#ffffff">
    TIM<tspan fill="#a855f7">STORE</tspan>
  </text>
  <text x="84" y="62" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" letter-spacing="4" fill="#a1a1aa">
    MOTO &bull; GADGETS &bull; GEAR
  </text>
</svg>