<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="strobeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#0d0918" />
  
  <!-- Light burst rays -->
  <circle cx="200" cy="200" r="140" fill="#7c3aed" opacity="0.12" />
  <circle cx="200" cy="200" r="90" fill="#c084fc" opacity="0.2" />

  <!-- Strobe Unit 1 (Horizontal) -->
  <rect x="110" y="150" width="180" height="80" rx="18" fill="#18102d" stroke="#c084fc" stroke-width="2.5" />
  <!-- Transparent LED Cover lens -->
  <rect x="130" y="165" width="140" height="50" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
  
  <!-- LED Diodes Glowing -->
  <circle cx="150" cy="190" r="12" fill="#e879f9" filter="url(#strobeGlow)" />
  <circle cx="183" cy="190" r="12" fill="#a855f7" filter="url(#strobeGlow)" />
  <circle cx="217" cy="190" r="12" fill="#60a5fa" filter="url(#strobeGlow)" />
  <circle cx="250" cy="190" r="12" fill="#f43f5e" filter="url(#strobeGlow)" />

  <!-- Button and USB port -->
  <circle cx="120" cy="190" r="4" fill="#a855f7" />
  <rect x="282" y="185" width="4" height="10" rx="2" fill="#c084fc" />

  <!-- Mode label -->
  <text x="200" y="270" fill="#c084fc" font-family="sans-serif" font-weight="800" font-size="14" letter-spacing="3" text-anchor="middle">7-COLOR RGB LED</text>
  <text x="200" y="292" fill="#94a3b8" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">USB CHARGEABLE &bull; WATERPROOF</text>
</svg>