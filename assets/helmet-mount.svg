<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0b0813" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#0d0918" />
  <circle cx="200" cy="200" r="160" fill="url(#bgGlow)" />
  
  <!-- Stylized Helmet Contour -->
  <path d="M120 250 C110 170, 150 110, 240 110 C290 110, 310 160, 310 220 C310 260, 280 290, 220 290 L160 290 Z" fill="#18122B" stroke="#6366f1" stroke-width="3" opacity="0.4" />
  <!-- Chin mount base bracket -->
  <polygon points="170,260 230,260 220,310 180,310" fill="#1e1b4b" stroke="#a855f7" stroke-width="3" />
  <!-- Strap loops -->
  <path d="M150 260 L170 270 M230 270 L250 260" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
  <path d="M160 300 L180 305 M220 305 L240 300" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" />
  <!-- Extension Pivot Arm -->
  <rect x="190" y="210" width="20" height="60" rx="6" fill="#312e81" stroke="#c084fc" stroke-width="2" />
  <circle cx="200" cy="240" r="6" fill="#c084fc" />
  <!-- Smartphone clamp -->
  <rect x="130" y="150" width="140" height="70" rx="10" fill="#1e1b4b" stroke="url(#violetGrad)" stroke-width="3" />
  <!-- Screen mockup with recording indicator -->
  <rect x="136" y="156" width="128" height="58" rx="6" fill="#090514" />
  <circle cx="152" cy="172" r="4" fill="#ef4444" />
  <text x="162" y="175" fill="#e2e8f0" font-size="10" font-family="sans-serif" font-weight="bold">REC 4K POV</text>
  <path d="M175 190 L225 190" stroke="#9333ea" stroke-width="2" stroke-dasharray="4 2" />
  <!-- Clamp brackets -->
  <rect x="125" y="165" width="8" height="40" rx="3" fill="#a855f7" />
  <rect x="267" y="165" width="8" height="40" rx="3" fill="#a855f7" />
</svg>